<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LePixel — Atelier de cartes</title>
<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{--paper:#f4f0e8;--ink:#24251f;--muted:#77786f;--line:#ded9ce;--green:#c8f169;--pink:#f5b7c8;--purple:#c8b9ff;--white:#fffdf8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}button,input,textarea{font:inherit}header{max-width:1240px;margin:auto;padding:23px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line)}body:before{content:'';display:block;height:8px;background:repeating-linear-gradient(90deg,var(--green) 0 26px,var(--pink) 26px 52px,var(--purple) 52px 78px)}.brand{display:flex;align-items:center;gap:11px;font:700 1.2rem 'Space Grotesk',sans-serif;letter-spacing:-.7px}.brand b{color:var(--ink)}.brand:before{content:'▦';width:36px;height:36px;display:grid;place-items:center;background:var(--green);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-size:19px}.pill{font-size:.85rem;color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:10px 15px;font-weight:700}main{max-width:1240px;margin:0 auto;padding:0 28px}.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:58px 0 42px;border-bottom:1px solid var(--line);margin-bottom:32px}h1{font:700 clamp(2.8rem,5vw,4.6rem)/1 'Space Grotesk',sans-serif;letter-spacing:-.065em;margin:0 0 16px}p{color:#66675e;line-height:1.7;margin:0}.btn{border:1.5px solid var(--ink);border-radius:7px;background:var(--ink);color:white;padding:13px 18px;font-weight:700;cursor:pointer;font-size:.91rem;transition:transform .15s,box-shadow .15s}.btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}.btn.secondary{background:var(--white);color:var(--ink)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:23px}.card{min-width:0}.preview{height:260px;background:var(--white);border:1.5px solid var(--ink);border-radius:5px;display:grid;place-items:center;overflow:hidden}.preview img{max-width:100%;max-height:100%;object-fit:contain;padding:18px;image-rendering:pixelated}.cardbody{padding:14px 2px}.card h3{font:600 1.13rem 'Space Grotesk',sans-serif;margin:0 0 12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{padding:9px 12px}.empty{border:1.5px dashed var(--line);padding:65px 20px;text-align:center;background:var(--white)}.empty h2{font-family:'Space Grotesk',sans-serif}.panel{background:var(--white);border:1.5px solid var(--ink);padding:28px;max-width:820px;margin:40px auto}.panel h1{font-size:2.7rem}.field{margin:20px 0}.field label{display:block;font-weight:700;margin-bottom:9px;font-size:14px}input[type=text],textarea{width:100%;border:1.5px solid var(--line);border-radius:7px;padding:13px;outline-color:var(--ink);background:white}textarea{resize:vertical}.uploads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.upload{border:1.5px dashed var(--ink);background:#f4f0e8;border-radius:5px;padding:18px;min-height:170px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center;color:var(--muted);font-size:13px}.upload input{display:none}.upload img{max-width:100%;height:100px;object-fit:contain;image-rendering:pixelated}.upload strong{color:var(--ink)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.detail{max-width:900px;margin:45px auto}.detailTop{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:25px}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.imagebox{background:var(--white);border:1.5px solid var(--ink);border-radius:5px;padding:16px}.imagebox h3{font:600 1.1rem 'Space Grotesk',sans-serif;margin:0 0 12px}.imagebox img{width:100%;height:270px;object-fit:contain;background:#f4f0e8;image-rendering:pixelated}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}@media(max-width:850px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){header{padding:17px 18px}main{padding:0 17px}.hero,.detailTop{align-items:flex-start;flex-direction:column}.hero{padding:38px 0}h1{font-size:3rem}.uploads,.gallery{grid-template-columns:1fr}.panel{padding:18px}.cards{gap:15px}.preview{height:180px}}
</style><style>
.pixel-modal{width:min(760px,calc(100% - 26px));max-height:92vh;padding:0;border:1.5px solid #24251f;background:#f4f0e8;color:#24251f;box-shadow:0 20px 80px #0003;overflow:auto}
.pixel-modal::backdrop{background:#20211d99;backdrop-filter:blur(3px)}

.pixel-modal-body{padding:20px}

@media(max-width:540px){.pixel-downloads{grid-template-columns:1fr}.pixel-download-card{display:grid;grid-template-columns:32px 1fr;align-items:center}.pixel-download-btn{grid-column:2}.pixel-modal-preview{min-height:180px}}
</style><style>
body.shared-only{background:#f4f0e8}body.shared-only header{display:flex!important}body.shared-only header .pill,body.shared-only nav,body.shared-only footer,body.shared-only .topline{display:none!important}

.shared-image-only img{max-width:100%;max-height:calc(100vh - 140px);object-fit:contain;image-rendering:pixelated}.shared-image-layout{display:flex;align-items:center;justify-content:center;gap:35px;max-width:1100px;width:100%}.shared-image-layout img{max-width:65%;}.shared-image-hint{max-width:280px;font-size:20px;font-weight:700;line-height:1.5;color:#24251f}@media(max-width:650px){.shared-image-layout{flex-direction:column;gap:18px}.shared-image-layout img{max-width:100%;max-height:55vh}.shared-image-hint{text-align:center;font-size:17px}}
</style></head><body><header><div class="brand">Le<b>Pixel</b></div><span class="pill">Atelier créatif</span></header><main id="app"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyBe6AvyeZJRBvzlpUcD-F44t_MG7Qrq0FE",authDomain:"lepixel-12572.firebaseapp.com",databaseURL:"https://lepixel-12572-default-rtdb.firebaseio.com",projectId:"lepixel-12572"};
let db=null,auth=null;
try{firebase.initializeApp(firebaseConfig);db=firebase.database();auth=firebase.auth()}catch(err){console.error('Firebase:',err)}
const app=document.querySelector('#app'),KEY='lepixel_cards_v1';
let cards=JSON.parse(localStorage.getItem(KEY)||'[]'),draft={images:{}};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(cards));return true}catch(e){alert('Stockage plein : utilisez des images plus petites ou supprimez des cartes.');return false}}
const PUBLIC_BASE='https://frenzifox9.github.io/Ab/';
const ADMIN_UID='2QwsY97xJVPpwwn0sf0vDNf7Qvh1';
let adminUser=null,cloudCards=[],authReady=false,currentRole='none',roles={},roleListener=null;
function isAdmin(){return currentRole==='admin'}
function canEdit(){return currentRole==='admin'||currentRole==='editor'}
function canCreate(){return isAdmin()}
function isSuspended(){return currentRole.startsWith('suspended_')}
function roleOf(uid){return uid===ADMIN_UID?'admin':(roles[uid]||'none')}
function escapeAttr(s){return esc(s)}
function urlFor(c){return PUBLIC_BASE+'#p='+c.id}
function shortId(){const a=new Uint8Array(7);crypto.getRandomValues(a);return Array.from(a,x=>'0123456789abcdefghijklmnopqrstuvwxyz'[x%36]).join('')}
async function publish(c){
 if(c.id && c.published && urlFor(c).length<=50)return c.id;
 if(!db||!auth)throw Error('Firebase est indisponible.');
 if(!canEdit())throw Error('Accès insuffisant');const user=auth.currentUser;
 const id=c.id||shortId();
 const link=location.origin+location.pathname+'#p='+id;
 if(link.length>50)throw Error('L’adresse configurée dépasse 50 caractères.');
 await db.ref('publicCards/'+id).set({title:c.title,description:c.description||'',images:c.images,owner:ADMIN_UID});
  await db.ref('adminCards/'+id).set({title:c.title,description:c.description||'',images:c.images,owner:ADMIN_UID,id});
 c.id=id;c.published=true;save();return id;
}
function fromHash(){try{let m=location.hash.match(/^#carte=(.*)$/);return m?JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))):null}catch(e){return null}}
function home(){history.replaceState(null,'',location.pathname+location.search);render()}
function render(){if(!authReady){app.innerHTML='<section class="panel"><h2>Chargement…</h2></section>';return}if(!adminUser){return loginScreen()}if(isSuspended()){app.innerHTML='<section class="panel"><h1>Compte suspendu</h1><p>Un administrateur doit réactiver ton accès.</p><div class="toolbar"><button class="btn secondary" onclick="logout()">Déconnexion</button></div></section>';return}let shared=fromHash();document.body.classList.toggle('shared-only',!!shared);if(shared)return detail(shared,true);app.innerHTML=`<section class="hero"><div><h1>Mes créations</h1><p>Créez et partagez vos modèles de pixel art en quelques clics.</p></div><div class="toolbar">${canCreate()?'<button class="btn" onclick="create()">+ Créer une carte</button>':''}${isAdmin()?'<button class="btn secondary" onclick="manageAccounts()">Gérer les comptes</button>':''}<button class="btn secondary" onclick="logout()">Déconnexion</button></div></section>${allCards().length?`<section class="cards">${allCards().map((c,i)=>`<article class="card"><div class="preview">${c.images.color?`<img src="${c.images.color}">`:'◻'}</div><div class="cardbody"><h3>${esc(c.title)}</h3><div class="actions"><button class="btn" onclick="detail(allCards()[${i}],false)">Voir</button><button class="btn secondary" onclick="share(${i})">Partager</button>${canEdit()?`<button class="btn secondary" onclick="editCard(${i})">Modifier</button>`:''}${isAdmin()?`<button class="btn secondary" onclick="removeCard(${i})">Supprimer</button>`:''}</div></div></article>`).join('')}</section>`:`<div class="empty"><h2>Votre atelier est prêt</h2><p>Créez votre première carte pour commencer votre collection.</p><br>${canCreate()?'<button class="btn" onclick="create()">Créer ma première carte</button>':''}</div>`}`}
function create(){if(!canCreate())return alert('Accès refusé');draft={images:{}};app.innerHTML=`<section class="panel"><h1>Nouvelle carte</h1><p>Ajoutez les quatre images de votre modèle de pixel art.</p><div class="field"><label for="title">Nom de la carte</label><input id="title" type="text" maxlength="90" placeholder="Ex. Renard en pixel art"></div><div class="field"><label for="description">Description (facultatif)</label><textarea id="description" rows="3" placeholder="Décrivez votre création..."></textarea></div><div class="uploads">${[['start','Image de départ'],['blank','Pixel art sans couleur'],['color','Pixel art avec couleur'],['grid','Grille']].map(([k,n])=>`<label class="upload" id="u-${k}"><strong>${n}</strong><span>Choisir une image (PNG, JPG, WEBP)</span><input type="file" accept="image/png,image/jpeg,image/webp" onchange="loadImage(event,'${k}')"></label>`).join('')}</div><div class="toolbar"><button class="btn secondary" onclick="home()">Annuler</button><button class="btn" onclick="finish()">Terminer et créer le lien</button></div></section>`}
async function loadImage(e,k){let file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/'))return alert('Choisissez une image.');let img=new Image();img.src=URL.createObjectURL(file);await img.decode();let canvas=document.createElement('canvas'),scale=Math.min(1,1100/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);draft.images[k]=canvas.toDataURL('image/webp',.72);URL.revokeObjectURL(img.src);document.getElementById('u-'+k).innerHTML=`<strong>${({start:'Image de départ',blank:'Sans couleur',color:'Avec couleur',grid:'Grille'})[k]}</strong><img src="${draft.images[k]}"><span>Cliquer pour remplacer</span><input type="file" accept="image/png,image/jpeg,image/webp" onchange="loadImage(event,'${k}')">`}
function finish(){if(!canCreate())return alert('Accès refusé');if(!adminUser)return loginScreen();let title=document.querySelector('#title').value.trim();if(!title)return alert('Donnez un nom à la carte.');if(['start','blank','color','grid'].some(k=>!draft.images[k]))return alert('Ajoutez les quatre images.');let c={title,description:document.querySelector('#description').value.trim(),images:draft.images};cards.unshift(c);if(!save()){cards.shift();return}detail(c,false,true)}
function detail(c,shared=false,created=false){
if(shared){window.currentCard=c;app.innerHTML=`<div class="shared-image-only"><div class="shared-image-layout"><img role="button" tabindex="0" style="cursor:pointer" onclick="openVersions()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openVersions()}" src="${c.images.start||''}" alt="${esc(c.title)}" title="Cliquer pour télécharger les versions"><p class="shared-image-hint">Pour télécharger la grille et le pixel art, clique sur l’image.</p></div></div>${versionsModal(c)}`;return;}
const base=c.images.start||'';
app.innerHTML=`<div class="detail"><div class="detailTop"><div><div class="eyebrow">${shared?'Mode abonné · Lecture seule':'Votre création'}</div><h1>${esc(c.title)}</h1><p>${esc(c.description)}</p></div>${shared?'':`<button class="btn secondary" onclick="home()">← Mes créations</button>`}</div>
<div class="imagebox" style="max-width:720px;margin:auto;cursor:pointer" onclick="openVersions()">
<h3>Image de départ <span style="float:right;font-weight:400">Cliquer pour ouvrir ↗</span></h3>
<img alt="Image de départ" src="${base}" style="height:min(58vh,500px)">
</div>
${!shared?`<div class="panel" style="margin-top:24px"><h3>${created?'Votre carte est prête !':'Partager cette carte'}</h3><p>Le lien ouvre cette carte en mode abonné, sans outil de création.</p><div class="toolbar"><button class="btn" onclick="copyCurrent()">Copier le lien</button></div><p class="muted" style="margin-top:12px">Les images sont publiées sur Firebase et le lien contient uniquement un identifiant court (50 caractères maximum).</p></div>`:''}
</div>
${versionsModal(c)}`;
window.currentCard=c;
}
function versionsModal(c){const base=c.images.start||'';return `<dialog id="versionsDialog" class="pixel-modal">
<div class="pixel-modal-head"><h2>${esc(c.title)}</h2><button class="pixel-close" onclick="document.getElementById('versionsDialog').close()" aria-label="Fermer">×</button></div>
<div class="pixel-modal-body">
<div class="pixel-modal-preview"><img alt="Image de départ" src="${base}"></div>
${c.description?`<p class="pixel-modal-description">${esc(c.description)}</p>`:''}
<div class="pixel-downloads">
${[['blank','🖍️','Sans couleur'],['color','🌈','Avec couleur'],['grid','▦','Grille']].map(([k,ico,label])=>`<div class="pixel-download-card"><span class="pixel-emoji">${ico}</span><strong>${label}</strong><button class="pixel-download-btn" onclick="downloadVersion('${k}')">Télécharger l'image ↗</button></div>`).join('')}
</div></div></dialog>`;}

function openVersions(){document.getElementById('versionsDialog').showModal()}
function downloadVersion(k){
const data=window.currentCard?.images?.[k];if(!data)return alert('Cette image est indisponible.');
const a=document.createElement('a');a.href=data;a.download=(window.currentCard.title||'lepixel').replace(/[^a-z0-9_-]/gi,'_')+'_'+k+'.'+(data.startsWith('data:image/png')?'png':data.startsWith('data:image/jpeg')?'jpg':'webp');document.body.appendChild(a);a.click();a.remove();
}

async function copyCurrent(){
 const button=document.querySelector('.detail .toolbar .btn');if(button){button.disabled=true;button.textContent='Publication en cours…'}
 try{await publish(window.currentCard);const u=urlFor(window.currentCard);
 if(navigator.clipboard && window.isSecureContext){await navigator.clipboard.writeText(u);alert('Lien court copié ! ('+u.length+' caractères)')}
 else prompt('Copiez ce lien ('+u.length+' caractères) :',u);
 }catch(err){alert('Impossible de publier : '+(err.message||err)+'\nVérifiez les règles Firebase et activez la connexion anonyme.')}finally{if(button){button.disabled=false;button.textContent='Copier le lien'}}
}
function share(i){detail(allCards()[i]);}
function editCard(i){if(!canEdit())return alert('Accès refusé');const c=allCards()[i];if(!c.id)return alert('Publie d’abord cette carte pour permettre sa modification partagée.');window.editingCard=c;draft={images:{...c.images}};createEditForm(c)}
function createEditForm(c){app.innerHTML=`<section class="panel"><h1>Modifier la carte</h1><div class="field"><label>Nom</label><input type="text" id="title" maxlength="90"></div><div class="field"><label>Description</label><textarea id="description" rows="3"></textarea></div><div class="uploads">${[['start','Image de départ'],['blank','Sans couleur'],['color','Avec couleur'],['grid','Grille']].map(([k,n])=>`<label class="upload" id="u-${k}"><strong>${n}</strong><img src="${draft.images[k]||''}"><span>Cliquer pour remplacer</span><input type="file" accept="image/png,image/jpeg,image/webp" onchange="loadImage(event,'${k}')"></label>`).join('')}</div><div class="toolbar"><button class="btn" onclick="saveEdit()">Enregistrer</button><button class="btn secondary" onclick="home()">Annuler</button></div></section>`;document.getElementById('title').value=c.title;document.getElementById('description').value=c.description||''}
async function saveEdit(){if(!canEdit())return alert('Accès refusé');const c=window.editingCard;if(!c?.id)return;const title=document.getElementById('title').value.trim();if(!title)return alert('Nom obligatoire');try{const update={title,description:document.getElementById('description').value.trim(),images:draft.images,owner:ADMIN_UID,id:c.id};await db.ref('adminCards/'+c.id).set(update);await db.ref('publicCards/'+c.id).set(update);cards=cards.filter(x=>x.id!==c.id);save();home()}catch(e){alert('Modification impossible : '+e.message)}}
function manageAccounts(){if(!isAdmin())return;const items=Object.entries(roles).filter(([uid])=>uid!==ADMIN_UID);app.innerHTML=`<section class="panel"><h1>Gestion des comptes</h1><p>Ajoute un UID Firebase, choisis un rôle, suspends ou réactive un compte.</p><form id="addRole"><div class="field"><label>UID Firebase</label><input type="text" id="roleUid" required maxlength="128" placeholder="Identifiant du compte"></div><div class="field"><label>Rôle</label><select id="roleType" style="width:100%;padding:13px"><option value="editor">Éditeur</option><option value="viewer">Lecteur</option><option value="admin">Administrateur</option></select></div><button class="btn" type="submit">Ajouter / Modifier</button></form><h2>Comptes autorisés</h2><p class="muted">Compte principal : ${ADMIN_UID} (administrateur permanent)</p>${items.length?items.map(([uid,role])=>`<div style="padding:14px 0;border-bottom:1px solid #ded9ce;overflow-wrap:anywhere"><strong>${esc(uid)}</strong><p>${esc(role)}</p><div class="toolbar"><button class="btn secondary" onclick="changeRole('${uid}')">Changer le rôle</button>${role.startsWith('suspended_')?`<button class="btn" onclick="toggleSuspend('${uid}')">Réactiver</button>`:role==='admin'?'':`<button class="btn secondary" onclick="toggleSuspend('${uid}')">Suspendre</button>`}<button class="btn secondary" onclick="removeRole('${uid}')">Retirer</button></div></div>`).join(''):'<p>Aucun autre compte.</p>'}<div class="toolbar"><button class="btn secondary" onclick="home()">Retour</button></div></section>`;document.getElementById('addRole').onsubmit=async e=>{e.preventDefault();const uid=document.getElementById('roleUid').value.trim(),role=document.getElementById('roleType').value;if(!/^[a-zA-Z0-9]{15,128}$/.test(uid)||uid===ADMIN_UID)return alert('UID invalide ou compte principal');try{await db.ref('accessRoles/'+uid).set(role);manageAccounts()}catch(e){alert('Accès Firebase refusé : '+e.message)}}}
async function changeRole(uid){if(!isAdmin())return;const role=prompt('Nouveau rôle : admin, editor ou viewer',roles[uid]);if(!['admin','editor','viewer'].includes(role))return;try{await db.ref('accessRoles/'+uid).set(role);manageAccounts()}catch(e){alert(e.message)}}
async function toggleSuspend(uid){if(!isAdmin())return;const role=roles[uid];if(!role||role==='admin')return;const next=role.startsWith('suspended_')?role.slice(10):'suspended_'+role;try{await db.ref('accessRoles/'+uid).set(next);manageAccounts()}catch(e){alert(e.message)}}
async function removeRole(uid){if(!isAdmin()||!confirm('Retirer ce compte ?'))return;try{await db.ref('accessRoles/'+uid).remove();manageAccounts()}catch(e){alert(e.message)}}

async function removeCard(i){if(!isAdmin())return alert('Accès refusé');const c=allCards()[i];if(!confirm('Supprimer cette carte de votre atelier ?'))return;try{if(c.id && c.owner===ADMIN_UID){await db.ref('adminCards/'+c.id).remove();await db.ref('publicCards/'+c.id).remove()}cards=cards.filter(x=>x!==c&&(!c.id||x.id!==c.id));save();render()}catch(e){alert('Suppression impossible : '+e.message)}}
function allCards(){const seen=new Set();return [...cloudCards,...cards].filter(c=>{if(c.id&&seen.has(c.id))return false;if(c.id)seen.add(c.id);return true})}
function loginScreen(){document.body.classList.remove('shared-only');app.innerHTML=`<section class="panel"><h1>Connexion créateur</h1><p>Connecte-toi avec ton compte Firebase pour créer tes pixel arts sur tous tes appareils.</p><form id="loginForm"><div class="field"><label>Adresse e-mail</label><input type="email" id="email" required autocomplete="username" style="width:100%;padding:13px;border:1px solid #ded9ce;border-radius:7px"></div><div class="field"><label>Mot de passe</label><input type="password" id="password" required autocomplete="current-password" style="width:100%;padding:13px;border:1px solid #ded9ce;border-radius:7px"></div><button class="btn" type="submit">Se connecter</button><p class="error" id="loginError" role="alert" style="margin-top:12px"></p></form></section>`;document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();let err=document.getElementById('loginError');err.textContent='';try{const result=await auth.signInWithEmailAndPassword(document.getElementById('email').value.trim(),document.getElementById('password').value);if(roleOf(result.user.uid)==='none'){await auth.signOut();throw Error('Ce compte n’est pas autorisé.')}}catch(ex){err.textContent='Connexion refusée : '+ex.message}}}
async function logout(){await auth.signOut();}
let cloudListener=null;
function startAdminSync(){if(cloudListener){db.ref('adminCards').off('value',cloudListener);cloudListener=null}if(!adminUser)return;cloudListener=snap=>{cloudCards=[];snap.forEach(child=>{const c=child.val();if(c&&c.images&&c.owner===ADMIN_UID)cloudCards.push(c)});if(!document.getElementById('title')&&!document.getElementById('addRole'))render()};db.ref('adminCards').on('value',cloudListener,err=>console.warn('Synchronisation impossible',err))}
async function route(){
 const match=location.hash.match(/^#p=([a-z0-9]{7}|[a-z0-9]{12})$/);
 if(match){document.body.classList.add('shared-only');app.innerHTML='<div class="panel"><h2>Chargement du pixel art…</h2></div>';
 try{if(!db)throw Error('Firebase indisponible');const snap=await db.ref('publicCards/'+match[1]).once('value');const c=snap.val();if(!c||!c.images)throw Error('Carte introuvable');if(location.hash==='#p='+match[1])detail(c,true)}
 catch(err){app.innerHTML='<div class="panel"><h2>Impossible d’ouvrir cette carte</h2><p>Vérifiez le lien et les règles de lecture Firebase.</p></div>'}
 return;
 }
 render();
}
auth.onAuthStateChanged(async u=>{authReady=false;if(roleListener){db.ref('accessRoles').off('value',roleListener);roleListener=null}adminUser=null;currentRole='none';roles={};if(u){try{const snap=await db.ref('accessRoles').once('value');roles=snap.val()||{};currentRole=roleOf(u.uid);if(currentRole!=='none'){adminUser=u;roleListener=sn=>{roles=sn.val()||{};currentRole=roleOf(u.uid);if(currentRole==='none'){auth.signOut();return}route()};db.ref('accessRoles').on('value',roleListener)}}catch(e){console.error('Autorisations',e);if(u.uid===ADMIN_UID){currentRole='admin';adminUser=u}else{app.innerHTML='<section class=\"panel\"><p>Impossible de lire les autorisations Firebase.</p></section>'}}}authReady=true;startAdminSync();route()});window.addEventListener('hashchange',route);route();
</script></body></html>
